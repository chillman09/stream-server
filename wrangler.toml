name = "stream-server"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static frontend. Only /api/* and /stream/* invoke the Worker; everything else is served from /public.
[assets]
directory = "./public"
run_worker_first = ["/api/*", "/stream/*"]

[vars]
ADMIN_USERNAME = "admin"
ALLOWED_ORIGIN = ""          # set only if the frontend is hosted on another origin

# Catalog + metadata. Create with: npx wrangler kv namespace create MEDIA_KV
[[kv_namespaces]]
binding = "MEDIA_KV"
id = "f4879c300d7d45f18fc9e27d1d587fd0"

# Optional: your own video files, served at /stream/<key> with range requests.
# Create with: npx wrangler r2 bucket create streamflix-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "streamflix-media"

# Staging environment (bindings are NOT inherited, so redeclare them).
[env.staging]
name = "streamflix-staging"
[env.staging.assets]
directory = "./public"
run_worker_first = ["/api/*", "/stream/*"]
[env.staging.vars]
ADMIN_USERNAME = "admin"
ALLOWED_ORIGIN = ""
[[env.staging.kv_namespaces]]
binding = "MEDIA_KV"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"
[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "streamflix-media-staging"
