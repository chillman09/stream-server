<!doctype html><html lang="en"><head><title>Admin sign in · StreamFlix</title><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:"#E50914",ink:"#141414"},fontFamily:{display:["\"Bebas Neue\"","Impact","sans-serif"],sans:["Inter","system-ui","sans-serif"]}}}}</script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css"></head>
<body class="bg-ink text-white font-sans min-h-screen grid place-items-center px-4">
<main class="w-full max-w-sm bg-black/60 border border-white/10 rounded-lg p-8">
  <a href="/" class="font-display text-brand text-4xl tracking-wide">STREAMFLIX</a>
  <h1 class="text-2xl font-semibold mt-6 mb-6">Admin sign in</h1>
  <form id="f" class="space-y-4">
    <label class="block text-sm text-zinc-300">Username<input name="username" autocomplete="username" required class="mt-1 w-full bg-zinc-800 rounded px-3 py-2.5 outline-none focus:ring-2 ring-brand"></label>
    <label class="block text-sm text-zinc-300">Password<input name="password" type="password" autocomplete="current-password" required class="mt-1 w-full bg-zinc-800 rounded px-3 py-2.5 outline-none focus:ring-2 ring-brand"></label>
    <p id="err" role="alert" class="text-sm text-brand min-h-5"></p>
    <button class="btn w-full bg-brand hover:bg-red-700 font-semibold py-2.5 rounded">Sign in</button>
  </form>
</main>
<script>
const f=document.getElementById('f'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(f)))});
  if(r.ok) location.href='/admin/dashboard'; else err.textContent=(await r.json().catch(()=>({}))).error||'Sign in failed';});
</script></body></html>
