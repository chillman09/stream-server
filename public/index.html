<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamFlix</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{colors:{brand:'#E50914',ink:'#141414'},fontFamily:{display:['"Bebas Neue"','Impact','sans-serif'],sans:['Inter','system-ui','sans-serif']}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-ink text-white font-sans antialiased">

<header id="nav" class="fixed top-0 inset-x-0 z-40 flex items-center gap-8 px-4 md:px-12 h-16 transition-colors duration-300">
  <a href="/" class="font-display text-brand text-3xl tracking-wide">STREAMFLIX</a>
  <nav class="hidden sm:flex gap-5 text-sm text-zinc-300">
    <a href="#top" class="hover:text-white">Home</a>
    <a href="#rows" class="hover:text-white">Browse</a>
    <a href="#" id="nav-list" class="hover:text-white">My List</a>
  </nav>
  <a href="/admin/login" class="ml-auto text-xs text-zinc-400 hover:text-white inline-flex items-center gap-1"><i data-lucide="shield" class="w-4 h-4"></i>Admin</a>
</header>

<section id="hero" class="relative h-[78vh] min-h-[460px] overflow-hidden">
  <video id="hero-video" class="absolute inset-0 w-full h-full object-cover" muted loop playsinline></video>
  <div class="absolute inset-0 bg-gradient-to-r from-black/85 via-black/40 to-transparent"></div>
  <div class="absolute inset-x-0 bottom-0 h-40 bg-gradient-to-t from-ink to-transparent"></div>
  <div class="relative h-full flex flex-col justify-end pb-24 md:pb-32 px-4 md:px-12 max-w-3xl" id="hero-body"></div>
  <button id="hero-mute" class="absolute right-4 md:right-12 bottom-28 md:bottom-36 w-10 h-10 grid place-items-center rounded-full border border-white/50 hover:bg-white/10" aria-label="Toggle sound"><i data-lucide="volume-x"></i></button>
</section>

<main id="rows" class="-mt-20 relative z-10 pb-16"></main>
<footer class="px-4 md:px-12 py-10 text-xs text-zinc-500">StreamFlix demo. Sample videos courtesy of the Blender Foundation.</footer>

<!-- Details modal -->
<div id="info" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm p-4 overflow-y-auto" role="dialog" aria-modal="true"></div>

<!-- Player modal -->
<div id="player" class="hidden fixed inset-0 z-[60] bg-black opacity-0 transition-opacity duration-300" role="dialog" aria-modal="true" aria-label="Video player">
  <video id="pv" class="w-full h-full bg-black" playsinline></video>
  <div id="pui" class="absolute inset-0 flex flex-col justify-between transition-opacity duration-300">
    <div class="flex items-center gap-4 p-4 md:p-6 bg-gradient-to-b from-black/80 to-transparent">
      <button id="pclose" class="btn w-10 h-10 grid place-items-center rounded-full hover:bg-white/10" aria-label="Close player"><i data-lucide="arrow-left"></i></button>
      <h2 id="pt" class="font-display text-2xl md:text-3xl tracking-wide"></h2>
    </div>
    <div class="p-4 md:p-6 bg-gradient-to-t from-black/90 to-transparent">
      <input id="seek" type="range" min="0" max="1000" value="0" class="w-full mb-3" aria-label="Seek">
      <div class="flex items-center gap-2 md:gap-4">
        <button id="pplay" class="pbtn" aria-label="Play or pause"><i data-lucide="play"></i></button>
        <button id="pback" class="pbtn" aria-label="Back 10 seconds"><i data-lucide="rotate-ccw"></i></button>
        <button id="pfwd" class="pbtn" aria-label="Forward 10 seconds"><i data-lucide="rotate-cw"></i></button>
        <button id="pmute" class="pbtn" aria-label="Mute"><i data-lucide="volume-2"></i></button>
        <input id="pvol" type="range" min="0" max="1" step="0.05" value="1" class="w-20 hidden sm:block" aria-label="Volume">
        <span id="ptime" class="text-sm text-zinc-300 tabular-nums">0:00 / 0:00</span>
        <button id="pfs" class="pbtn ml-auto" aria-label="Fullscreen"><i data-lucide="maximize"></i></button>
      </div>
    </div>
  </div>
</div>

<script src="/app.js" type="module"></script>
</body>
</html>
